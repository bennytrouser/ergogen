units:
  capx: 18.1
  capy: 18.1
  thumbcapx: 27.75
  kx: u + 0.5    # Key spacing horizontal
  ky: u + 0.5    # Key spacing vertical
  thumb_offsetx: 0.25kx
  xiao_x: 17.5
  xiao_y: 21
  outx: 0.5capx +1  # Used for plate outlines
  outy: 0.5capy +1  # Used for plate outlines
  mirshift: 38

points:
  zones:
  zones.matrix:
    anchor:
      shift: [100,-100]
    mirror:
      ref: matrix_inner_home
      shift: mirshift
    key:
      width: capx
      height: capy
      spread: u      
      padding: u
      autobind: 0
    rows:
      bottom:
        bind: [1, 60, 1, 1]
      home:
        bind: [1, 1, 0, 1]
      top:
        bind: [1, 1, 0, 1]
    columns:
      pinky:
        key:
          rows:
            bottom:
            home:
            top:
      ring:
        key:
          stagger: 0.65U
        rows:
          bottom:
          home:
          top:
      middle:
        key:
          stagger: 0.25U
        rows:
          bottom:
            bind: [1,1,1,1]
          home:
          top:
      index:
        key:
          stagger: -0.25U
        rows:
          bottom:
            bind: [1,1,1,1]
          home:
          top:
      inner:
        key:
          stagger: 0.5ky
        rows:
          top.skip: true
          bottom:
            bind: [1,2,20,1]
          home:
  zones.thumb:
    anchor:
      ref: matrix_index_top
      shift: [0.6u,-63]
      rotate: -20
    mirror:
      ref: matrix_inner_home
      shift: mirshift
    key:
      width: capx
      height: capy
      autobind: 0
    rows:
      home:
    columns:
      left.key:
        name: thumb_tucky
        bind: [0,1,1,1] # U,R,D,L
      right.key:
        spread: kx+0.2
        stagger: 0.2kx
        rotate: -95
        name: thumb_reachy
        bind: [1,1,2,1.2191] # R,D,L,U

  # MCU
  zones.mcu:
    anchor:
      ref: matrix_inner_home
      shift: [19.5,-.5]
      rotate: 0
    mirror: 
      ref: matrix_inner_home
      shift: mirshift
    key:
      name: mcu
      width: xiao_x+1
      height: xiao_y+1
      autobind: 0
  # Power slider
  zones.pcm12:
    anchor:
      - ref: mcu
        shift: [0.5xiao_x+0.3, -1.1xiao_y]
        rotate: 0
    key:
      name: pcm12
      height: 2.6
      width: 6.7
    mirror:
      ref: matrix_inner_home
      shift: mirshift

  zones.xiaocut:
    anchor:
      - ref: mcu
        rotate: 0
        shift: [-0.0capy,.5]
    mirror: 
      ref: matrix_inner_home
      shift: mirshift
    key:
      name: xiaocut
      height: xiao_y + 1
      width: 13
  zones.battcut:
    anchor:
      - ref: mcu
        shift: [-1, -24]
    mirror:
      ref: matrix_inner_home
      shift: mirshift
    key:
      name: battcut
      height: 22
      width: 12.2


outlines:
  _casecuts:
    - what: rectangle
      where:
        - /matrix_.*/
        - /thumb_.*/
      size: [ 14, 14]
      bound: false
  _keycapsbound:
    - what: rectangle
      where:
        - /matrix_.*/
        - /thumb_tucky/
      size: [capx, capy]
      bound: true
    - what: rectangle
      where:
        - /thumb_reachy/
      size: [thumbcapx, capy]
      bound: true
  _keycapsunbound:
    - what: rectangle
      where:
        - /matrix_.*/
        - /thumb_tucky/
      size: [capx, capy]
      bound: false
    - what: rectangle
      where:
        - /thumb_reachy/
      size: [thumbcapx, capy]
      bound: false
    - what: rectangle
      where:
        - /mcu/
      size: [xiao_x,xiao_y]
      bound: false
      fillet: 1
  _mcu:
    - what: rectangle
      where: /mcu/
      size: [xiao_x, xiao_y]
      fillet: 1
  _mcu_extra:
    - what: polygon
      bound: true
      operation: stack
      points:
        - ref: matrix_inner_home
          shift: [0.5capx, 0.5capy+1]
        - ref: matrix_inner_home
          shift: [30, 0.5capy+1]
        - ref: thumb_reachy
          shift: [-15,0]
          affect: y
        - ref: thumb_reachy
          orient: -95
          shift: [-0.5capy-1,0]
        - ref: thumb_reachy
          orient: -95
          shift: 10
  _mcu_extra_mirror:
    - what: polygon
      bound: true
      operation: stack
      points:
        - ref: mirror_matrix_inner_home
          shift: [0.5capx, 0.5capy+1]
        - ref: mirror_matrix_inner_home
          shift: [30, 0.5capy+1]
        - ref: mirror_thumb_reachy
          shift: [-15,0]
          affect: y
        - ref: mirror_thumb_reachy
          orient: -95
          shift: [-0.5capy-1,0]
        - ref: mirror_thumb_reachy
          orient: -95
          shift: 10
  _mountholes:
    - what: circle
      where: /mount.*/
      radius: 1.55
  _xiaocut:
    - what: rectangle
      where: /xiaocut/
      size: [13,xiao_y +1]
    - what: rectangle
      where: /battcut/
      size: [12.2, 22]
  _thumbcut:
    - what: rectangle
      where:
        - ref: thumb_reachy
          shift: [1,11]
      size: [45,2]
  _thumbcut_mirror:
    - what: rectangle
      where:
        - ref: mirror_thumb_reachy
          shift: [1,11]
      size: [45,2]
  _platecut:
    - ^_keycapsbound
    - _mcu_extra
    - _mcu_extra_mirror
    - -_thumbcut_mirror
    - -_thumbcut

  _powerslider:
    - what: rectangle
      where: /pcm12/
      size: [2.6,6.2]

  plate:
    - name: _platecut
      fillet: 2
  preview:
    - ^plate
    - ^_keycapsunbound
    - ^_mountholes
    - ^_thumbcut
    - ^_thumbcut_mirror
    - ^_powerslider

  case:
    - ^plate
    - ^_casecuts
    - ^_mcu
  
  keyplate:
    - ^plate
    - ^_casecuts

  
  _keywellparts:
    - what: rectangle
      where: /matrix*/
      size: [capx+2,capy+2]
    - what: rectangle
      where: /thumb_tu*/
      size: [capx+3,capy+2]
      adjust.shift: [0.5,0]
    - what: rectangle
      where: /thumb_reachy/
      size: [thumbcapx+2,capy+2]
      adjust.shift: [0,0]
  keywells:
    - name: _keywellparts
      fillet: 2
  keywellwithkeys:
    - ^keywells
    - ^_keycapsunbound
  casesketch: 
    - name: _platecut
      fillet: 2
      expand: 3>
    - name: _casecuts
      operation: stack
    - name: keywells
      operation: stack
  # casewithwells:
  #   - ^plate
  #   - ^keywells

  mounts:
    - what: rectangle
      where: /middle_top*/
      size: [17,3]
      adjust.shift: [0,0.63capy]
    - what: rectangle
      where: /thumb_reachy*/
      size: [20,3]
      adjust.shift: [0,0.63capy]
    - what: rectangle
      where: /thumb_reachy*/
      size: [3,15]
      adjust.shift: [0.59thumbcapx,0]
    - what: rectangle
      where: /pinky_home*/
      size: [3,50]
      # fillet: 1.4
      adjust.shift: [-0.63capx,0]
    - what: rectangle
      where: /inner_bottom*/
      size: [3,40]
      adjust.shift: [31.5,3]
      # fillet: 1.4
    - what: rectangle
      where: /inner_home*/
      size: [30,3]
      adjust.shift: [10,0.63capy]
      # fillet: 1.4
    - what: rectangle
      where: /pinky_bottom*/
      size: [40,3]
      adjust.shift: [25,-0.63capy]
      # fillet: 1.4
    - name: plate
    - ^_casecuts


